<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Healthcare Appointment System</title><link rel="stylesheet" href="css/style.css"></head><body><header><h1>Healthcare Appointment System</h1><p>Book and manage your healthcare appointments</p></header><main><section class="card"><h2>Book Appointment</h2><form id="appointmentForm"><label>Patient Name</label><input id="patient" required><label>Doctor</label><select id="doctor" required><option value="">Select Doctor</option><option>Dr. Priya - General Medicine</option><option>Dr. Arun - Cardiology</option><option>Dr. Meena - Pediatrics</option></select><label>Date</label><input id="date" type="date" required><label>Time</label><input id="time" type="time" required><label>Reason</label><textarea id="reason" required></textarea><button>Book Appointment</button></form><p id="msg"></p></section><section class="card"><h2>Appointments</h2><div id="list"></div></section></main><footer>Healthcare Appointment System © 2026</footer><script src="js/script.js"></script></body></html>
